<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Το Κάστρο της Καλλιθέας — Περιπέτεια στην Ιστορία!</title>
    <meta name="description" content="Μια μαγική περιπέτεια στην ιστορία του Κάστρου Καλλιθέας — για παιδιά">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Background decorations -->
    <div class="bg-deco" aria-hidden="true">
        <span class="bg-star" style="top: 8%; left: 6%; animation-delay: 0s;">⭐</span>
        <span class="bg-star" style="top: 15%; right: 8%; animation-delay: 0.5s;">✨</span>
        <span class="bg-star" style="top: 45%; left: 3%; animation-delay: 1s;">🌟</span>
        <span class="bg-star" style="bottom: 20%; right: 5%; animation-delay: 1.5s;">⭐</span>
        <span class="bg-star" style="bottom: 8%; left: 12%; animation-delay: 2s;">✨</span>
        <span class="bg-star" style="top: 60%; right: 12%; animation-delay: 0.8s;">🌟</span>
        <span class="bg-star" style="top: 25%; left: 45%; animation-delay: 1.2s;">✨</span>
        <span class="bg-blob" style="top: -100px; left: -100px; background: #4f8bff;"></span>
        <span class="bg-blob" style="bottom: -120px; right: -80px; background: #ffc93c;"></span>
    </div>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-icon">🏰</div>

            <h1 class="welcome-title">Το Κάστρο της Καλλιθέας</h1>

            <p class="welcome-subtitle">Μια Μαγική Περιπέτεια στην Ιστορία!</p>

            <div class="welcome-divider" aria-hidden="true">
                <span class="welcome-divider-line"></span>
                <span class="welcome-divider-diamond">◆</span>
                <span class="welcome-divider-line"></span>
            </div>

            <p class="welcome-description">
                Ανακαλύψτε τα μυστικά ενός αρχαίου κάστρου με διασκεδαστικό τρόπο!
            </p>

            <button id="start-btn" class="btn btn-primary btn-big">
                Ξεκινήστε την Περιπέτεια! <i class="fas fa-rocket"></i>
            </button>
        </div>
    </div>

    <!-- PRESENTATION -->
    <div id="presentation-container" class="presentation-container hidden">

        <!-- Progress Bar -->
        <div class="progress-wrap">
            <div class="progress-bar-kids" id="progress-bar"></div>
        </div>

        <!-- Header -->
        <header class="kid-header">
            <p class="municipality-text">
                <i class="fas fa-landmark"></i>
                ΔΗΜΟΣ ΦΑΡΣΑΛΩΝ · 2026
            </p>
            <h1 class="main-title">
                🏰 Το Κάστρο της Καλλιθέας 🏰
            </h1>
            <p class="main-subtitle">Μια μαγική περιπέτεια στην ιστορία!</p>
        </header>

        <!-- Slides container -->
        <div class="content-area" id="slides-wrapper">
            <!-- Slides generated by app.js -->
        </div>

        <!-- Navigation -->
        <div class="kid-navigation" id="navigation">
            <button id="prevBtn" class="btn btn-nav" onclick="prevSlide()" disabled>
                <i class="fas fa-arrow-left"></i> Πίσω
            </button>

            <div class="slide-counter">
                Σελίδα
                <span class="current-slide" id="currentPage">1</span>
                από
                <span class="total-slides" id="totalPages">15</span>
            </div>

            <button id="nextBtn" class="btn btn-nav" onclick="nextSlide()">
                Επόμενο <i class="fas fa-arrow-right"></i>
            </button>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
